name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov

      - name: Verify packages import cleanly
        run: |
          python -c "from dashboard.main import main; print('dashboard OK')"
          python -c "from admin.main import main; print('admin OK')"
          python -c "from radar.main import main; print('radar OK')"

      - name: Generate a minimal dataset for DB-dependent tests
        run: |
          python telecom_net_sim.py --seed 42 --subs 200 --cdrs 500

      - name: Run fast tests
        run: pytest -m "not slow" --tb=short

      - name: Run slow tests
        run: pytest --run-slow --tb=short