name: Security

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "telecom_*.py"
      - "attack_core.py"
      - "admin/**"
      - "dashboard/**"
      - "radar/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "telecom_*.py"
      - "attack_core.py"
  schedule:
    # Every Monday at 06:00 UTC (09:30 Tehran)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7"

      - name: Run bandit
        run: bandit -c pyproject.toml -r . -f txt

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit>=2.7

      - name: Audit CI requirements
        run: pip-audit -r requirements-ci.txt

      - name: Audit runtime requirements
        # Runtime has many optional packages that aren't exercised by
        # the simulator itself; we only need to ensure the CI set is
        # clean. Audit runtime too but don't fail the whole job on
        # unrelated issues.
        run: pip-audit -r requirements.txt || true
