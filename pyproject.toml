# ==================================================================
# Project metadata (PEP 621)
# ==================================================================
[project]
name = "telecom-net-sim"
version = "3.0.0"
description = "Fully local mobile network simulator with OSINT/SIGINT analysis, attack simulation, and three Streamlit dashboards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Hossein Rastegar" },
]
keywords = [
    "telecom", "simulator", "5G", "6G", "OSINT", "SIGINT",
    "security", "streamlit", "network", "SS7", "Diameter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "streamlit>=1.30",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "streamlit-autorefresh>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/hosras/MNO-simulator"
Repository = "https://github.com/hosras/MNO-simulator"
Issues = "https://github.com/hosras/MNO-simulator/issues"

# ==================================================================
# Build backend (PEP 517)
# ==================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "dashboard",
    "dashboard.services",
    "dashboard.views",
    "admin",
    "admin.services",
    "admin.views",
    "radar",
    "radar.services",
    "radar.views",
]
py-modules = [
    "telecom_admin",
    "telecom_attack",
    "telecom_common",
    "telecom_dashboard",
    "telecom_net_sim",
    "telecom_radar",
    "telecom_ui_common",
    "attack_core",
]

# ==================================================================
# Ruff — linter + formatter
# ==================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "^docs/",
    "^site/",
    "^telecom_sim_output/",
    "^generate_readme\\.py$",
    "^generate_evidence\\.py$",
    "^generate_docs\\.py$",
    "^generate_project_report\\.py$",
    "^make_coverage_badge\\.py$",
    "^restore_2pb\\.py$",
    "^check_6g_now\\.py$",
    "^main\\.py$",
    "^telecom_net_sim\\.py$",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line-too-long (formatter handles it)
    "B008",    # function-call-in-default (Streamlit idiom)
    "C408",    # dict() vs {} — plotly calls read better with dict()
    "SIM102",  # nested-if — common Streamlit checkbox+button pattern
    "SIM108",  # ternary — multi-line if/else is clearer when condition is long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "F811", "B011", "B904"]
"__init__.py" = ["F401"]
"attack_core.py" = ["B006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==================================================================
# Coverage
# ==================================================================
[tool.coverage.run]
source = ["."]
branch = true
omit = [
    # Tests
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",

    # Streamlit views (require runtime to test)
    "dashboard/views/*",
    "admin/views/*",
    "radar/views/*",

    # Entry points / shims
    "telecom_dashboard.py",
    "telecom_admin.py",
    "telecom_radar.py",
    "dashboard/main.py",
    "admin/main.py",
    "radar/main.py",
    "dashboard/__init__.py",
    "admin/__init__.py",
    "radar/__init__.py",
    "dashboard/_config.py",
    "admin/_config.py",
    "radar/_config.py",

    # Streamlit UI helpers
    "telecom_ui_common.py",
    "dashboard/services/styles.py",
    "dashboard/services/ui.py",
    "dashboard/services/data.py",
    "radar/services/ui.py",

    # Generators / tools
    "generate_readme.py",
    "generate_evidence.py",
    "generate_project_report.py",
    "restore_2pb.py",
    "check_6g_now.py",
    "main.py",

    # Simulator (tested via integration test only)
    "telecom_net_sim.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
# ==================================================================
# mypy — static type checker
# ==================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Files to skip entirely
exclude = [
    "^docs/",
    "^site/",
    "^telecom_sim_output/",
    "^generate_readme\\.py$",
    "^generate_evidence\\.py$",
    "^generate_docs\\.py$",
    "^generate_project_report\\.py$",
    "^make_coverage_badge\\.py$",
    "^restore_2pb\\.py$",
    "^check_6g_now\\.py$",
    "^main\\.py$",
]

# Per-module overrides
[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "reportlab.*",
    "streamlit_autorefresh.*",
]
ignore_missing_imports = true

# Exclude legacy monolithic simulator (tested via integration test)
[[tool.mypy.overrides]]
module = "telecom_net_sim"
ignore_errors = true

# Tests can be looser
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true
# ==================================================================
# bandit — security linter
# ==================================================================
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "docs",
    "site",
    "telecom_sim_output",
]
# Skip low-value checks in a simulation context
skips = [
    # B101: assert_used — normal in tests, and in non-test code we use them
    # for internal invariants that should never fail in production.
    "B101",

    # B110: try_except_pass — defensive code that intentionally ignores
    # expected errors (e.g. optional features, cleanup paths).
    "B110",

    # B112: try_except_continue — same rationale as B110.
    "B112",

    # B311: random — we use `random` for deterministic simulation with a
    # fixed seed, NOT for cryptographic purposes.
    "B311",

    # B404/B603/B607: subprocess — used only to spawn our own simulator
    # via `sys.executable`, not user input.
    "B404",
    "B603",
    "B607",
]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py", "*/tests/*"]

# ==================================================================
# pytest-benchmark
# ==================================================================
[tool.pytest.ini_options]
# (This section may merge with existing pytest.ini — see pytest.ini for
#  markers. We add benchmark-specific options here.)
benchmark_columns = [
    "min",
    "max",
    "mean",
    "stddev",
    "median",
    "iqr",
    "outliers",
    "ops",
    "rounds",
]
benchmark_warmup = "on"
benchmark_min_rounds = 5
benchmark_disable_gc = true
