site_name: TELECOM-NET-SIM
site_description: Fully local mobile network simulator (2G-6G) with OSINT/SIGINT analytics
site_url: https://hosras.github.io/MNO-simulator/
repo_url: https://github.com/hosras/MNO-simulator
repo_name: hosras/MNO-simulator
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Hossein Rastegar

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Security: security.md
  - Contributing: contributing.md
  - API Reference:
    - Overview: api/index.md
    - Simulator: api/simulator.md
    - Attack Simulation: api/attack.md
    - Common Utilities: api/common.md
    - Services: api/services.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hosras/MNO-simulator
  generator: false
